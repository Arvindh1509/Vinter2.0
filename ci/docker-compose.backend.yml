version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=8000
      - DATABASE_URL=${DATABASE_URL}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/vinterbash/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
